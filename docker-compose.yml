services:
  deck-analysis:
    build: .
    restart: always
    ports:
      - "8010:8010"
    environment:
      DATA_ROOT: /data
      DATASET_STATE_PATH: /data/config/dataset_state.json
      PROVIDER_CONFIG_PATH: /data/config/provider.json
      USER_DECKS_PATH: /data/runtime/decks.json
      OPENAI_COMPATIBLE_BASE_URL: https://api.kimi.com/coding/
      OPENAI_COMPATIBLE_API_KEY: ${OPENAI_COMPATIBLE_API_KEY:-}
      OPENAI_COMPATIBLE_MODEL: kimi-code
    volumes:
      - ./data:/data
